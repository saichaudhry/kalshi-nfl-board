name: Refresh market snapshot

# Both APIs used here are public, so this workflow holds no secrets. It never
# touches the portfolio endpoints and never sees any trading data: those live
# in data/private.local.json, which is gitignored and only ever written locally.
on:
  schedule:
    - cron: '*/30 * * * *'   # full market refresh
    - cron: '*/10 * * * *'   # scores only — they go stale fastest
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A full sweep is ~1,100 series and takes minutes; scores are one request
      # per league. Running the cheap one more often keeps scores current
      # without re-walking the whole exchange.
      - name: Refresh scores only
        if: github.event.schedule == '*/10 * * * *'
        run: python3 fetch_markets.py --scores-only

      - name: Refresh all markets
        if: github.event.schedule != '*/10 * * * *'
        run: python3 fetch_markets.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No change in market data; nothing to commit."
          else
            # Explicit paths only: never let a stray private file in.
            git add data/index.json data/sport-*.json
            git commit -m "Refresh snapshot ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
