name: Refresh market snapshot

# Both APIs used here are public, so this workflow holds no secrets. It never
# touches the portfolio endpoints and never sees any trading data: those live
# in data/private.local.json, which is gitignored and only written locally.
on:
  schedule:
    - cron: '0 * * * *'   # hourly, on the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full sweep is ~1,100 series; give it room but never let it hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh all markets and scores
        run: python3 fetch_markets.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No change in market data; nothing to commit."
          else
            # Explicit paths only: never let a stray private file in.
            git add data/index.json data/sport-*.json
            git commit -m "Refresh snapshot ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
